<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeJournal">
<meta name="description" content="Personal Trading Journal - Track rules and trades">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Trade Journal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --text: #e6edf3;
    --text2: #8b949e;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── SYNC STATUS BAR ── */
  .sync-bar {
    height: 3px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .sync-bar .sync-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .sync-bar.syncing .sync-fill { animation: syncPulse 1.2s infinite; }
  @keyframes syncPulse {
    0%   { width: 0%; opacity: 1; }
    50%  { width: 70%; opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 0;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .sync-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text2);
    transition: background .3s;
  }
  .sync-dot.online  { background: var(--green); }
  .sync-dot.syncing { background: var(--accent); animation: blink .7s infinite; }
  .sync-dot.error   { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    flex: 1; padding: 8px 4px;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px; cursor: pointer;
    transition: all .2s; text-transform: uppercase;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── CONTENT ── */
  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .tab-pane { display: none; flex-direction: column; height: 100%; }
  .tab-pane.active { display: flex; }

  /* ── LOADING OVERLAY ── */
  .loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; gap: 16px;
    transition: opacity .4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text2);
    letter-spacing: 1px;
  }

  /* ── RULES TAB ── */
  .rules-toolbar {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: flex-end; flex-shrink: 0;
  }
  .rules-list {
    flex: 1; overflow-y: auto;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .rule-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .rule-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 700;
    color: var(--accent); min-width: 24px; flex-shrink: 0; line-height: 1.4;
  }
  .rule-text { flex: 1; font-size: 14px; line-height: 1.5; color: var(--text); word-break: break-word; }
  .rule-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: background .15s;
  }
  .icon-btn:active { background: var(--border); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }

  /* ── TRADES TAB ── */
  .trades-toolbar {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    align-items: center; flex-shrink: 0; gap: 8px;
  }
  .summary { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2); }
  .summary span { color: var(--text); font-weight: 600; }
  .table-wrap { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 600px; }
  thead th {
    background: var(--surface2); color: var(--accent);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    padding: 8px 6px; border-bottom: 2px solid var(--border);
    white-space: nowrap; position: sticky; top: 0; z-index: 2;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
  tbody tr:active { background: var(--surface2); }
  tbody td {
    padding: 8px 6px; vertical-align: top;
    word-break: break-word; white-space: normal;
    max-width: 90px; line-height: 1.4; color: var(--text);
  }
  .col-date { width: 72px; min-width: 72px; }
  .col-pl   { width: 44px; min-width: 44px; }
  .col-amt  { width: 60px; min-width: 60px; text-align: right; }
  .col-time { width: 46px; min-width: 46px; }
  .col-pts  { width: 42px; min-width: 42px; text-align: right; }
  .col-stip { width: 36px; min-width: 36px; text-align: center; }
  .col-rem  { min-width: 80px; }
  .col-rup  { min-width: 80px; }
  .col-act  { width: 56px; min-width: 56px; text-align: center; }

  .pill { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .pill-p { background: rgba(63,185,80,.15); color: var(--green); }
  .pill-l { background: rgba(248,81,73,.15); color: var(--red); }
  .pill-y { background: rgba(88,166,255,.15); color: var(--accent2); }
  .pill-n { background: rgba(139,148,158,.1); color: var(--text2); }

  tfoot td {
    background: var(--surface2); font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; padding: 8px 6px;
    border-top: 2px solid var(--border); position: sticky; bottom: 0;
  }
  tfoot .label { color: var(--text2); font-size: 10px; }
  tfoot .total-val { text-align: right; }

  /* ── BUTTONS ── */
  .btn-add {
    background: var(--accent); color: #000;
    border: none; border-radius: var(--radius);
    padding: 8px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; white-space: nowrap; transition: opacity .15s;
  }
  .btn-add:active { opacity: .8; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 520px;
    max-height: 90dvh; overflow-y: auto;
    padding: 20px 16px 32px; animation: slideUp .2s ease;
  }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal h2 {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    font-weight: 700; color: var(--accent); letter-spacing: 1px;
    margin-bottom: 16px; text-transform: uppercase;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text2); letter-spacing: .5px;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color .15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: none; height: 70px; }
  .form-group select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save {
    flex: 1; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); padding: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-cancel {
    flex: 1; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .confirm-modal { text-align: center; padding: 28px 20px 24px; }
  .confirm-modal .icon { font-size: 36px; margin-bottom: 10px; }
  .confirm-modal p { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
  .confirm-modal .btn-del {
    background: var(--red); color: #fff; border: none;
    border-radius: var(--radius); padding: 12px 24px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700;
    cursor: pointer; width: 100%; margin-bottom: 8px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 20px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text);
    z-index: 300; transition: transform .3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (orientation: landscape) and (max-height: 500px) {
    .header h1 { display: none; }
    .header { padding: 0 16px; }
    .tab-btn { padding: 6px 4px; font-size: 11px; }
    .rules-list { gap: 6px; padding: 8px; }
    .rule-text { font-size: 13px; }
    table { font-size: 10px; }
    .modal { max-height: 95dvh; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>CONNECTING...</p>
</div>

<!-- SYNC BAR -->
<div class="sync-bar" id="syncBar"><div class="sync-fill" id="syncFill"></div></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <h1>⚡ Trade Journal</h1>
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">--</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('rules')">📋 Rules</button>
    <button class="tab-btn" onclick="switchTab('trades')">📊 Trades</button>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- RULES TAB -->
  <div class="tab-pane active" id="tab-rules">
    <div class="rules-toolbar">
      <button class="btn-add" onclick="openRuleModal()">+ ADD RULE</button>
    </div>
    <div class="rules-list" id="rulesList">
      <div class="empty-state"><div class="big">📜</div>Loading rules...</div>
    </div>
  </div>

  <!-- TRADES TAB -->
  <div class="tab-pane" id="tab-trades">
    <div class="trades-toolbar">
      <div class="summary" id="tradeSummary">Trades: <span>0</span></div>
      <button class="btn-add" onclick="openTradeModal()">+ ADD TRADE</button>
    </div>
    <div class="table-wrap">
      <table id="tradesTable">
        <thead>
          <tr>
            <th class="col-date">Date</th>
            <th class="col-pl">P/L</th>
            <th class="col-amt">Amt ₹</th>
            <th class="col-time">Entry</th>
            <th class="col-time">Exit</th>
            <th class="col-pts">Pts</th>
            <th class="col-stip">Stip</th>
            <th class="col-rem">Remarks</th>
            <th class="col-rup">Rule Upd</th>
            <th class="col-act">Act</th>
          </tr>
        </thead>
        <tbody id="tradesBody"></tbody>
        <tfoot id="tradesFoot"></tfoot>
      </table>
    </div>
  </div>

</div>

<!-- RULE MODAL -->
<div class="modal-overlay" id="ruleModal">
  <div class="modal">
    <h2 id="ruleModalTitle">Add Rule</h2>
    <div class="form-group">
      <label>Rule</label>
      <textarea id="ruleText" placeholder="Enter your trading rule..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('ruleModal')">Cancel</button>
      <button class="btn-save" onclick="saveRule()">Save</button>
    </div>
  </div>
</div>

<!-- TRADE MODAL -->
<div class="modal-overlay" id="tradeModal">
  <div class="modal">
    <h2 id="tradeModalTitle">Add Trade</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="tradeDate">
      </div>
      <div class="form-group">
        <label>Profit / Loss</label>
        <select id="tradePL">
          <option value="">-- Select --</option>
          <option value="Profit">Profit</option>
          <option value="Loss">Loss</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="tradeAmt" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label>Points</label>
        <input type="number" id="tradePts" placeholder="0.00" step="0.01">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Entry Time</label>
        <input type="time" id="tradeEntry">
      </div>
      <div class="form-group">
        <label>Exit Time</label>
        <input type="time" id="tradeExit">
      </div>
    </div>
    <div class="form-group">
      <label>Traded After Stipulated Period</label>
      <select id="tradeStip">
        <option value="">-- Select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="form-group">
      <label>Remarks</label>
      <textarea id="tradeRemarks" placeholder="Notes about this trade..."></textarea>
    </div>
    <div class="form-group">
      <label>Rules Update</label>
      <textarea id="tradeRulesUpd" placeholder="Any rule changes noted..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('tradeModal')">Cancel</button>
      <button class="btn-save" onclick="saveTrade()">Save</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal confirm-modal">
    <div class="icon">🗑️</div>
    <h2 style="margin-bottom:8px">Delete?</h2>
    <p id="confirmMsg">This action cannot be undone.</p>
    <button class="btn-del" id="confirmOk">Delete</button>
    <button class="btn-cancel" style="width:100%" onclick="closeModal('confirmModal')">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase config ──
const firebaseConfig = {
  apiKey: "AIzaSyCXD2xzNHTaCOxBZv6EUG1pUWCoOwInsQw",
  authDomain: "tradingjournalseng.firebaseapp.com",
  databaseURL: "https://tradingjournalseng-default-rtdb.firebaseio.com",
  projectId: "tradingjournalseng",
  storageBucket: "tradingjournalseng.firebasestorage.app",
  messagingSenderId: "157189423562",
  appId: "1:157189423562:web:c1098bfadd1f54f4150f33"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── Connection timeout: show error if no data in 10s ──
const connTimeout = setTimeout(() => {
  if (!rulesLoaded || !tradesLoaded) {
    setSyncState('error');
    const ol = document.getElementById('loadingOverlay');
    ol.querySelector('p').textContent = 'CHECK FIREBASE RULES';
    ol.querySelector('.spinner').style.borderTopColor = '#f85149';
    // Still allow using app with empty data after timeout
    setTimeout(() => {
      rulesLoaded = true; tradesLoaded = true;
      checkLoaded();
      showToast('⚠️ Firebase not reachable — check DB rules');
    }, 3000);
  }
}, 10000);

// ── Refs ──
const rulesRef  = ref(db, 'rules');
const tradesRef = ref(db, 'trades');

// ── In-memory store (keyed by Firebase push key) ──
let rulesData  = {};   // { fbKey: { text, order } }
let tradesData = {};   // { fbKey: { ...fields } }
let editRuleKey  = null;
let editTradeKey = null;

// ── Sync UI ──
function setSyncState(state) {
  const dot   = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const bar   = document.getElementById('syncBar');
  dot.className = 'sync-dot ' + state;
  label.textContent = state === 'online' ? 'LIVE' : state === 'syncing' ? 'SYNC' : state === 'error' ? 'ERR' : '--';
  bar.className = 'sync-bar ' + (state === 'syncing' ? 'syncing' : '');
}

// ── Hide loader once data arrives ──
let rulesLoaded = false, tradesLoaded = false;
function checkLoaded() {
  if (rulesLoaded && tradesLoaded) {
    clearTimeout(connTimeout);
    const ol = document.getElementById('loadingOverlay');
    ol.classList.add('hidden');
    setTimeout(() => ol.style.display = 'none', 400);
    setSyncState('online');
  }
}

// ── Real-time listeners ──
onValue(rulesRef, snap => {
  rulesData = snap.val() || {};
  rulesLoaded = true;
  renderRules();
  checkLoaded();
}, err => { setSyncState('error'); showToast('⚠️ Rules sync error'); });

onValue(tradesRef, snap => {
  tradesData = snap.val() || {};
  tradesLoaded = true;
  renderTrades();
  checkLoaded();
}, err => { setSyncState('error'); showToast('⚠️ Trades sync error'); });

// ════════════════════════════
//  RULES
// ════════════════════════════
window.renderRules = function() {
  const list = document.getElementById('rulesList');
  const entries = Object.entries(rulesData).sort((a,b) => (a[1].order||0) - (b[1].order||0));
  if (!entries.length) {
    list.innerHTML = '<div class="empty-state"><div class="big">📜</div>No rules yet.<br>Add your first trading rule!</div>';
    return;
  }
  list.innerHTML = entries.map(([key, r], i) => `
    <div class="rule-card">
      <div class="rule-num">${i+1}.</div>
      <div class="rule-text">${escHtml(r.text)}</div>
      <div class="rule-actions">
        <button class="icon-btn" onclick="openRuleModal('${key}')">✏️</button>
        <button class="icon-btn" onclick="deleteRule('${key}')">🗑️</button>
      </div>
    </div>
  `).join('');
};

window.openRuleModal = function(key = null) {
  editRuleKey = key;
  document.getElementById('ruleModalTitle').textContent = key ? 'Edit Rule' : 'Add Rule';
  document.getElementById('ruleText').value = key ? (rulesData[key]?.text || '') : '';
  document.getElementById('ruleModal').classList.add('open');
};

window.saveRule = async function() {
  const txt = document.getElementById('ruleText').value.trim();
  if (!txt) { showToast('⚠️ Please enter a rule'); return; }
  setSyncState('syncing');
  try {
    if (editRuleKey) {
      await update(ref(db, 'rules/' + editRuleKey), { text: txt });
    } else {
      const order = Date.now();
      await push(rulesRef, { text: txt, order });
    }
    setSyncState('online');
    closeModal('ruleModal');
    showToast('✅ Rule saved');
  } catch(e) { setSyncState('error'); showToast('❌ Save failed'); }
};

window.deleteRule = function(key) {
  showConfirm('Delete this rule?', async () => {
    setSyncState('syncing');
    try {
      await remove(ref(db, 'rules/' + key));
      setSyncState('online');
      showToast('🗑️ Rule deleted');
    } catch(e) { setSyncState('error'); showToast('❌ Delete failed'); }
  });
};

// ════════════════════════════
//  TRADES
// ════════════════════════════
window.renderTrades = function() {
  const tbody   = document.getElementById('tradesBody');
  const tfoot   = document.getElementById('tradesFoot');
  const summary = document.getElementById('tradeSummary');
  const entries = Object.entries(tradesData).sort((a,b) => {
    const da = a[1].date || '', db2 = b[1].date || '';
    return da < db2 ? 1 : da > db2 ? -1 : 0;
  });

  if (!entries.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text2);font-size:12px;">No trades yet. Add your first!</td></tr>`;
    tfoot.innerHTML = '';
    summary.innerHTML = 'Trades: <span>0</span>';
    return;
  }

  let totalAmt = 0, totalPts = 0;
  entries.forEach(([,t]) => {
    const sign = t.pl === 'Loss' ? -1 : 1;
    totalAmt += sign * (parseFloat(t.amt) || 0);
    totalPts += sign * (parseFloat(t.pts) || 0);
  });

  tbody.innerHTML = entries.map(([key, t]) => {
    const isProfit = t.pl === 'Profit';
    const sign = isProfit ? '+' : '-';
    const amtColor = isProfit ? 'var(--green)' : 'var(--red)';
    const pillPL   = t.pl   ? `<span class="pill ${isProfit?'pill-p':'pill-l'}">${t.pl}</span>` : '—';
    const pillStip = t.stip ? `<span class="pill ${t.stip==='Yes'?'pill-y':'pill-n'}">${t.stip}</span>` : '—';
    const amtDisp  = t.amt  ? `<span style="color:${amtColor}">${sign}${parseFloat(t.amt).toLocaleString('en-IN',{maximumFractionDigits:2})}</span>` : '—';
    const ptsDisp  = t.pts  ? `<span style="color:${amtColor}">${sign}${parseFloat(t.pts).toFixed(2)}</span>` : '—';
    return `<tr>
      <td class="col-date" style="font-family:'IBM Plex Mono',monospace;font-size:10px">${fmtDate(t.date)}</td>
      <td class="col-pl">${pillPL}</td>
      <td class="col-amt">${amtDisp}</td>
      <td class="col-time" style="font-family:'IBM Plex Mono',monospace;font-size:10px">${t.entry||'—'}</td>
      <td class="col-time" style="font-family:'IBM Plex Mono',monospace;font-size:10px">${t.exit||'—'}</td>
      <td class="col-pts">${ptsDisp}</td>
      <td class="col-stip">${pillStip}</td>
      <td class="col-rem" style="font-size:10px;color:var(--text2)">${escHtml(t.remarks||'')}</td>
      <td class="col-rup" style="font-size:10px;color:var(--text2)">${escHtml(t.rulesUpd||'')}</td>
      <td class="col-act">
        <div style="display:flex;gap:3px;justify-content:center">
          <button class="icon-btn" style="width:26px;height:26px;font-size:12px" onclick="openTradeModal('${key}')">✏️</button>
          <button class="icon-btn" style="width:26px;height:26px;font-size:12px" onclick="deleteTrade('${key}')">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const tc = totalAmt >= 0 ? 'var(--green)' : 'var(--red)';
  const pc = totalPts >= 0 ? 'var(--green)' : 'var(--red)';
  tfoot.innerHTML = `<tr>
    <td colspan="2" class="label">TOTAL (${entries.length})</td>
    <td class="total-val" style="color:${tc}">${totalAmt>=0?'+':''}${totalAmt.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
    <td colspan="2"></td>
    <td class="total-val" style="color:${pc}">${totalPts>=0?'+':''}${totalPts.toFixed(2)}</td>
    <td colspan="4"></td>
  </tr>`;

  summary.innerHTML = `Trades: <span>${entries.length}</span> &nbsp; Net: <span style="color:${tc}">${totalAmt>=0?'▲':'▼'} ₹${Math.abs(totalAmt).toLocaleString('en-IN',{maximumFractionDigits:2})}</span>`;
};

window.openTradeModal = function(key = null) {
  editTradeKey = key;
  document.getElementById('tradeModalTitle').textContent = key ? 'Edit Trade' : 'Add Trade';
  const t = key ? (tradesData[key] || {}) : {};
  document.getElementById('tradeDate').value     = t.date     || today();
  document.getElementById('tradePL').value       = t.pl       || '';
  document.getElementById('tradeAmt').value      = t.amt      || '';
  document.getElementById('tradeEntry').value    = t.entry    || '';
  document.getElementById('tradeExit').value     = t.exit     || '';
  document.getElementById('tradePts').value      = t.pts      || '';
  document.getElementById('tradeStip').value     = t.stip     || '';
  document.getElementById('tradeRemarks').value  = t.remarks  || '';
  document.getElementById('tradeRulesUpd').value = t.rulesUpd || '';
  document.getElementById('tradeModal').classList.add('open');
};

window.saveTrade = async function() {
  const trade = {
    date:     document.getElementById('tradeDate').value,
    pl:       document.getElementById('tradePL').value,
    amt:      document.getElementById('tradeAmt').value,
    entry:    document.getElementById('tradeEntry').value,
    exit:     document.getElementById('tradeExit').value,
    pts:      document.getElementById('tradePts').value,
    stip:     document.getElementById('tradeStip').value,
    remarks:  document.getElementById('tradeRemarks').value.trim(),
    rulesUpd: document.getElementById('tradeRulesUpd').value.trim(),
    ts:       Date.now()
  };
  if (!trade.date) { showToast('⚠️ Please select a date'); return; }
  setSyncState('syncing');
  try {
    if (editTradeKey) {
      await set(ref(db, 'trades/' + editTradeKey), trade);
    } else {
      await push(tradesRef, trade);
    }
    setSyncState('online');
    closeModal('tradeModal');
    showToast('✅ Trade saved');
  } catch(e) { setSyncState('error'); showToast('❌ Save failed'); }
};

window.deleteTrade = function(key) {
  showConfirm('Delete this trade entry?', async () => {
    setSyncState('syncing');
    try {
      await remove(ref(db, 'trades/' + key));
      setSyncState('online');
      showToast('🗑️ Trade deleted');
    } catch(e) { setSyncState('error'); showToast('❌ Delete failed'); }
  });
};

// ════════════════════════════
//  HELPERS
// ════════════════════════════
window.switchTab = function(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['rules','trades'][i]===name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
};

window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

let confirmCb = null;
window.showConfirm = function(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  confirmCb = cb;
  document.getElementById('confirmModal').classList.add('open');
};
document.getElementById('confirmOk').onclick = () => {
  closeModal('confirmModal');
  if (confirmCb) confirmCb();
  confirmCb = null;
};

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); });
});

let toastTimer;
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

window.today    = () => new Date().toISOString().split('T')[0];
window.fmtDate  = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y.slice(2)}`; };
window.escHtml  = s => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';

// ── Service Worker registration ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
