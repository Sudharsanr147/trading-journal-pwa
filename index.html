<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeJournal">
<meta name="description" content="Personal Trading Journal - Track rules and trades">
<link rel="manifest" href="/trading-journal-pwa/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/trading-journal-pwa/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/trading-journal-pwa/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/trading-journal-pwa/icons/icon-192.png">
<title>Trade Journal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --text: #e6edf3;
    --text2: #8b949e;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── SYNC STATUS BAR ── */
  .sync-bar {
    height: 3px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .sync-bar .sync-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .sync-bar.syncing .sync-fill { animation: syncPulse 1.2s infinite; }
  @keyframes syncPulse {
    0%   { width: 0%; opacity: 1; }
    50%  { width: 70%; opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 0;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .sync-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text2);
    transition: background .3s;
  }
  .sync-dot.online  { background: var(--green); }
  .sync-dot.syncing { background: var(--accent); animation: blink .7s infinite; }
  .sync-dot.error   { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    flex: 1; padding: 8px 4px;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px; cursor: pointer;
    transition: all .2s; text-transform: uppercase;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── CONTENT ── */
  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .tab-pane { display: none; flex-direction: column; height: 100%; }
  .tab-pane.active { display: flex; }

  /* ── LOADING OVERLAY ── */
  .loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; gap: 16px;
    transition: opacity .4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text2);
    letter-spacing: 1px;
  }

  /* ── RULES TAB ── */
  .rules-toolbar {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: flex-end; flex-shrink: 0;
  }
  .rules-list {
    flex: 1; overflow-y: auto;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .rule-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex; align-items: flex-start; gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .rule-card.active-card { border-color: var(--accent); background: var(--surface2); }
  .rule-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(14px, 4vw, 18px); font-weight: 700;
    color: var(--accent); min-width: 28px; flex-shrink: 0; line-height: 1.4;
  }
  .rule-text {
    flex: 1;
    font-size: clamp(15px, 4.2vw, 20px);
    line-height: 1.45; color: var(--text); word-break: break-word;
  }
  /* Actions hidden by default, shown on tap */
  .rule-actions {
    display: flex; gap: 6px; flex-shrink: 0;
    overflow: hidden; width: 0; opacity: 0;
    transition: width .2s ease, opacity .2s ease;
    pointer-events: none;
  }
  .rule-card.active-card .rule-actions {
    width: 68px; opacity: 1; pointer-events: auto;
  }
  .icon-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: background .15s;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--border); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }

  /* ── TRADES TAB ── */
  .trades-toolbar {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    align-items: center; flex-shrink: 0; gap: 8px;
  }
  .summary { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2); }
  .summary span { color: var(--text); font-weight: 600; }

  /* ── TRADES LIST (scrollable area) ── */
  .trades-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ── TOTALS FOOTER BAR ── */
  .trades-footer {
    flex-shrink: 0;
    background: var(--surface2);
    border-top: 2px solid var(--border);
    padding: 8px 12px;
    display: flex; gap: 16px; align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
  }
  .trades-footer .tf-label { color: var(--text2); font-size: 10px; margin-right: 2px; }

  /* ════════════════════════
     MOBILE: CARD LAYOUT
     shown on screens < 700px
     ════════════════════════ */
  .trade-card {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .trade-card:nth-child(even) { background: rgba(255,255,255,.025); }

  /* Row 1: Date + P/L pill + Amount (big) + action buttons */
  .tc-row1 {
    display: flex; align-items: center; gap: 8px;
  }
  .tc-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text2); flex-shrink: 0;
  }
  .tc-amt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 700; flex: 1;
  }
  .tc-actions { display: flex; gap: 5px; margin-left: auto; flex-shrink: 0; }

  /* Row 2: Entry / Exit / Points / Stip */
  .tc-row2 {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }
  .tc-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--text2);
  }
  .tc-chip span { color: var(--text); font-weight: 600; }

  /* Row 3: Remarks / Rules Update (only if filled) */
  .tc-row3 { font-size: 11px; color: var(--text2); line-height: 1.4; }
  .tc-row3 b { color: var(--accent); font-weight: 600; font-size: 10px; }

  /* ════════════════════════
     DESKTOP: TABLE LAYOUT
     shown on screens ≥ 700px
     ════════════════════════ */
  .trade-table-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
  thead th {
    background: var(--surface2); color: var(--accent);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    padding: 9px 8px; border-bottom: 2px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    position: sticky; top: 0; z-index: 2;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
  tbody td { padding: 8px 8px; vertical-align: top; word-break: break-word; line-height: 1.4; }
  .col-date { width: 9%; }
  .col-pl   { width: 7%; }
  .col-amt  { width: 10%; text-align: right; }
  .col-time { width: 7%; }
  .col-pts  { width: 7%; text-align: right; }
  .col-stip { width: 6%; text-align: center; }
  .col-rem  { width: 17%; }
  .col-rup  { width: 17%; }
  .col-act  { width: 8%; text-align: center; }

  .pill { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .pill-p { background: rgba(63,185,80,.15); color: var(--green); }
  .pill-l { background: rgba(248,81,73,.15); color: var(--red); }
  .pill-y { background: rgba(88,166,255,.15); color: var(--accent2); }
  .pill-n { background: rgba(139,148,158,.1); color: var(--text2); }

  /* Show cards on mobile, table on desktop */
  .trade-card        { display: flex; }
  .trade-table-wrap  { display: none; }

  @media (min-width: 700px) {
    .trade-card        { display: none; }
    .trade-table-wrap  { display: block; }
    table { font-size: 13px; }
    thead th { font-size: 12px; }
  }

  /* ── BUTTONS ── */
  .btn-add {
    background: var(--accent); color: #000;
    border: none; border-radius: var(--radius);
    padding: 8px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; white-space: nowrap; transition: opacity .15s;
  }
  .btn-add:active { opacity: .8; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 520px;
    max-height: 90dvh; overflow-y: auto;
    padding: 20px 16px 32px; animation: slideUp .2s ease;
  }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal h2 {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    font-weight: 700; color: var(--accent); letter-spacing: 1px;
    margin-bottom: 16px; text-transform: uppercase;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text2); letter-spacing: .5px;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color .15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: none; height: 70px; }
  .form-group select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save {
    flex: 1; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); padding: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-cancel {
    flex: 1; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .confirm-modal { text-align: center; padding: 28px 20px 24px; }
  .confirm-modal .icon { font-size: 36px; margin-bottom: 10px; }
  .confirm-modal p { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
  .confirm-modal .btn-del {
    background: var(--red); color: #fff; border: none;
    border-radius: var(--radius); padding: 12px 24px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700;
    cursor: pointer; width: 100%; margin-bottom: 8px;
  }

  /* ── TRADE DETAIL POPUP ── */
  .detail-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .detail-overlay.open { display: flex; }
  .detail-popup {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0; width: 100%; max-width: 540px;
    max-height: 80dvh; overflow-y: auto;
    padding: 6px 16px 32px; animation: slideUp .22s ease;
  }
  .detail-handle {
    width: 40px; height: 4px; background: var(--border);
    border-radius: 4px; margin: 10px auto 14px;
  }
  .detail-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .detail-date {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text2);
  }
  .detail-amt {
    font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; flex: 1;
  }
  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
  }
  .detail-field { background: var(--surface2); border-radius: var(--radius); padding: 10px 12px; }
  .detail-field .df-label {
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text2); margin-bottom: 4px;
  }
  .detail-field .df-val {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: var(--text);
  }
  .detail-note {
    background: var(--surface2); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 14px; font-size: 13px;
    color: var(--text2); line-height: 1.5;
  }
  .detail-note b { color: var(--accent); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .detail-actions {
    display: flex; gap: 10px; margin-top: 4px;
  }
  .btn-edit-detail {
    flex: 1; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); padding: 13px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-del-detail {
    flex: 1; background: rgba(248,81,73,.15); color: var(--red);
    border: 1px solid rgba(248,81,73,.3); border-radius: var(--radius); padding: 13px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer;
  }

  /* ── SWIPE HINT ── */
  .swipe-hint {
    text-align: center; font-size: 10px; color: var(--border);
    font-family: 'IBM Plex Mono', monospace; padding: 3px 0 0;
    letter-spacing: 1px;
  }

  /* ── TAB SWIPE CONTAINER ── */
  .content { touch-action: pan-y; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 20px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text);
    z-index: 300; transition: transform .3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (orientation: landscape) and (max-height: 500px) {
    .header h1 { display: none; }
    .header { padding: 0 16px; }
    .tab-btn { padding: 6px 4px; font-size: 11px; }
    .rules-list { gap: 5px; padding: 6px 10px; }
    .rule-text { font-size: clamp(13px, 3.5vw, 16px); }
    .rule-card { padding: 7px 10px; }
    .modal { max-height: 95dvh; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>CONNECTING...</p>
</div>

<!-- SYNC BAR -->
<div class="sync-bar" id="syncBar"><div class="sync-fill" id="syncFill"></div></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <h1>⚡ Trade Journal</h1>
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">--</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('rules')">📋 Rules</button>
    <button class="tab-btn" onclick="switchTab('trades')">📊 Trades</button>
  </div>
  <div class="swipe-hint">← swipe to switch tabs →</div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- RULES TAB -->
  <div class="tab-pane active" id="tab-rules">
    <div class="rules-toolbar">
      <button class="btn-add" onclick="openRuleModal()">+ ADD RULE</button>
    </div>
    <div class="rules-list" id="rulesList">
      <div class="empty-state"><div class="big">📜</div>Loading rules...</div>
    </div>
  </div>

  <!-- TRADES TAB -->
  <div class="tab-pane" id="tab-trades">
    <div class="trades-toolbar">
      <div class="summary" id="tradeSummary">Trades: <span>0</span></div>
      <button class="btn-add" onclick="openTradeModal()">+ ADD TRADE</button>
    </div>
    <div id="tradesContainer" class="trades-list">
      <!-- Filled by JS — cards on mobile, table on desktop -->
    </div>
    <div class="trades-footer" id="tradesSummaryBar"></div>
  </div>

</div>

<!-- RULE MODAL -->
<div class="modal-overlay" id="ruleModal">
  <div class="modal">
    <h2 id="ruleModalTitle">Add Rule</h2>
    <div class="form-group">
      <label>Rule</label>
      <textarea id="ruleText" placeholder="Enter your trading rule..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('ruleModal')">Cancel</button>
      <button class="btn-save" onclick="saveRule()">Save</button>
    </div>
  </div>
</div>

<!-- TRADE MODAL -->
<div class="modal-overlay" id="tradeModal">
  <div class="modal">
    <h2 id="tradeModalTitle">Add Trade</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="tradeDate">
      </div>
      <div class="form-group">
        <label>Profit / Loss</label>
        <select id="tradePL">
          <option value="">-- Select --</option>
          <option value="Profit">Profit</option>
          <option value="Loss">Loss</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="tradeAmt" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label>Points</label>
        <input type="number" id="tradePts" placeholder="0.00" step="0.01">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Entry Time</label>
        <input type="time" id="tradeEntry">
      </div>
      <div class="form-group">
        <label>Exit Time</label>
        <input type="time" id="tradeExit">
      </div>
    </div>
    <div class="form-group">
      <label>Traded After Stipulated Period</label>
      <select id="tradeStip">
        <option value="">-- Select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="form-group">
      <label>Remarks</label>
      <textarea id="tradeRemarks" placeholder="Notes about this trade..."></textarea>
    </div>
    <div class="form-group">
      <label>Rules Update</label>
      <textarea id="tradeRulesUpd" placeholder="Any rule changes noted..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('tradeModal')">Cancel</button>

<div class="detail-overlay" id="tradeDetailOverlay" onclick="handleDetailOverlayClick(event)">

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Firebase via REST API - no SDK, no connection delays -->
<script>
// ══ Firebase REST Config ══
const DB = 'https://tradingjournalseng-default-rtdb.asia-southeast1.firebasedatabase.app';
const API_KEY = 'AIzaSyCXD2xzNHTaCOxBZv6EUG1pUWCoOwInsQw';

// ── In-memory store ──
let rulesData  = {};
let tradesData = {};
let editRuleKey  = null;
let editTradeKey = null;
let pollTimer    = null;

// ── REST helpers ──
async function fbGet(path) {
  const r = await fetch(`${DB}/${path}.json?auth=${API_KEY}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function fbPut(path, data) {
  const r = await fetch(`${DB}/${path}.json?auth=${API_KEY}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function fbPost(path, data) {
  const r = await fetch(`${DB}/${path}.json?auth=${API_KEY}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function fbDelete(path) {
  const r = await fetch(`${DB}/${path}.json?auth=${API_KEY}`, { method: 'DELETE' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Sync UI ──
function setSyncState(state) {
  const dot   = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const bar   = document.getElementById('syncBar');
  dot.className   = 'sync-dot ' + state;
  label.textContent = state==='online' ? 'LIVE' : state==='syncing' ? 'SYNC' : state==='error' ? 'ERR' : '--';
  bar.className   = 'sync-bar ' + (state==='syncing' ? 'syncing' : '');
}

// ── Load all data ──
async function loadAll() {
  setSyncState('syncing');
  try {
    const [r, t] = await Promise.all([fbGet('rules'), fbGet('trades')]);
    rulesData  = r || {};
    tradesData = t || {};
    renderRules();
    renderTrades();
    setSyncState('online');
    // Hide loader
    const ol = document.getElementById('loadingOverlay');
    ol.classList.add('hidden');
    setTimeout(() => ol.style.display = 'none', 400);
    // Poll every 15s to pick up changes from other devices
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const [r2, t2] = await Promise.all([fbGet('rules'), fbGet('trades')]);
        rulesData  = r2 || {};
        tradesData = t2 || {};
        renderRules();
        renderTrades();
      } catch(e) {}
    }, 15000);
  } catch(e) {
    setSyncState('error');
    showToast('❌ Cannot reach Firebase — check internet');
    // Still hide loader and allow offline view
    setTimeout(() => {
      const ol = document.getElementById('loadingOverlay');
      ol.classList.add('hidden');
      setTimeout(() => ol.style.display = 'none', 400);
    }, 2000);
  }
}

// ════════════════════════════
//  RULES
// ════════════════════════════
window.renderRules = function() {
  const list = document.getElementById('rulesList');
  const entries = Object.entries(rulesData).sort((a,b) => (a[1].order||0) - (b[1].order||0));
  if (!entries.length) {
    list.innerHTML = '<div class="empty-state"><div class="big">📜</div>No rules yet.<br>Add your first trading rule!</div>';
    return;
  }
  list.innerHTML = entries.map(([key, r], i) => `
    <div class="rule-card" onclick="toggleRuleCard(this)" data-key="${key}">
      <div class="rule-num">${i+1}.</div>
      <div class="rule-text">${escHtml(r.text)}</div>
      <div class="rule-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openRuleModal('${key}')">✏️</button>
        <button class="icon-btn" onclick="event.stopPropagation();deleteRule('${key}')">🗑️</button>
      </div>
    </div>
  `).join('');
};

window.toggleRuleCard = function(el) {
  const wasActive = el.classList.contains('active-card');
  // Close all
  document.querySelectorAll('.rule-card.active-card').forEach(c => c.classList.remove('active-card'));
  // Toggle current
  if (!wasActive) el.classList.add('active-card');
};

// Tap outside rules list closes any open card
document.addEventListener('click', e => {
  if (!e.target.closest('.rule-card')) {
    document.querySelectorAll('.rule-card.active-card').forEach(c => c.classList.remove('active-card'));
  }
});

window.openRuleModal = function(key = null) {
  editRuleKey = key;
  document.getElementById('ruleModalTitle').textContent = key ? 'Edit Rule' : 'Add Rule';
  document.getElementById('ruleText').value = key ? (rulesData[key]?.text || '') : '';
  document.getElementById('ruleModal').classList.add('open');
};

window.saveRule = async function() {
  const txt = document.getElementById('ruleText').value.trim();
  if (!txt) { showToast('⚠️ Please enter a rule'); return; }
  setSyncState('syncing');
  try {
    if (editRuleKey) {
      await fbPut('rules/' + editRuleKey, { text: txt, order: rulesData[editRuleKey]?.order || Date.now() });
      rulesData[editRuleKey] = { text: txt, order: rulesData[editRuleKey]?.order || Date.now() };
    } else {
      const order = Date.now();
      const res = await fbPost('rules', { text: txt, order });
      rulesData[res.name] = { text: txt, order };
    }
    setSyncState('online');
    closeModal('ruleModal');
    renderRules();
    showToast('✅ Rule saved');
  } catch(e) { setSyncState('error'); showToast('❌ Save failed: ' + e.message); }
};

window.deleteRule = function(key) {
  showConfirm('Delete this rule?', async () => {
    setSyncState('syncing');
    try {
      await fbDelete('rules/' + key);
      delete rulesData[key];
      setSyncState('online');
      renderRules();
      showToast('🗑️ Rule deleted');
    } catch(e) { setSyncState('error'); showToast('❌ Delete failed'); }
  });
};

// ════════════════════════════
//  TRADES
// ════════════════════════════
window.renderTrades = function() {
  const container = document.getElementById('tradesContainer');
  const footer    = document.getElementById('tradesSummaryBar');
  const summary   = document.getElementById('tradeSummary');

  const entries = Object.entries(tradesData).sort((a,b) => {
    const da = a[1].date||'', db2 = b[1].date||'';
    return da < db2 ? 1 : da > db2 ? -1 : 0;
  });

  if (!entries.length) {
    container.innerHTML = `<div class="empty-state"><div class="big">📊</div>No trades yet.<br>Add your first trade!</div>`;
    footer.innerHTML = '';
    summary.innerHTML = 'Trades: <span>0</span>';
    return;
  }

  let totalAmt = 0, totalPts = 0;
  entries.forEach(([,t]) => {
    const s = t.pl === 'Loss' ? -1 : 1;
    totalAmt += s * (parseFloat(t.amt)||0);
    totalPts += s * (parseFloat(t.pts)||0);
  });

  // ── MOBILE CARDS ──
  const cards = entries.map(([key, t]) => {
    const isP = t.pl === 'Profit';
    const sign = isP ? '+' : '-';
    const col  = isP ? 'var(--green)' : 'var(--red)';
    const pillPL   = t.pl   ? `<span class="pill ${isP?'pill-p':'pill-l'}">${t.pl}</span>` : '';
    const pillStip = t.stip ? `<span class="pill ${t.stip==='Yes'?'pill-y':'pill-n'}">${t.stip}</span>` : '';
    const amtTxt   = t.amt  ? `${sign}₹${parseFloat(t.amt).toLocaleString('en-IN',{maximumFractionDigits:2})}` : '—';
    const ptsTxt   = t.pts  ? `${sign}${parseFloat(t.pts).toFixed(1)}` : '—';
    const remarksRow = (t.remarks||t.rulesUpd) ? `
      <div class="tc-row3">
        ${t.remarks  ? `<b>NOTE</b> ${escHtml(t.remarks)}` : ''}
        ${t.remarks && t.rulesUpd ? ' &nbsp;·&nbsp; ' : ''}
        ${t.rulesUpd ? `<b>RULE</b> ${escHtml(t.rulesUpd)}` : ''}
      </div>` : '';
    return `
    <div class="trade-card" onclick="openTradeDetail('${key}')">
      <div class="tc-row1">
        <div class="tc-date">${fmtDate(t.date)}</div>
        ${pillPL}
        <div class="tc-amt" style="color:${col}">${amtTxt}</div>
      </div>
      <div class="tc-row2">
        <div class="tc-chip">In <span>${t.entry||'—'}</span></div>
        <div class="tc-chip">Out <span>${t.exit||'—'}</span></div>
        <div class="tc-chip">Pts <span style="color:${col}">${ptsTxt}</span></div>
        ${t.stip ? `<div class="tc-chip">Stip ${pillStip}</div>` : ''}
      </div>
      ${remarksRow}
    </div>`;
  }).join('');

  // ── DESKTOP TABLE ──
  const rows = entries.map(([key, t]) => {
    const isP = t.pl==='Profit';
    const sign = isP?'+':'-';
    const col  = isP?'var(--green)':'var(--red)';
    const pillPL   = t.pl   ? `<span class="pill ${isP?'pill-p':'pill-l'}">${t.pl}</span>` : '—';
    const pillStip = t.stip ? `<span class="pill ${t.stip==='Yes'?'pill-y':'pill-n'}">${t.stip}</span>` : '—';
    const amtDisp  = t.amt  ? `<span style="color:${col}">${sign}${parseFloat(t.amt).toLocaleString('en-IN',{maximumFractionDigits:2})}</span>` : '—';
    const ptsDisp  = t.pts  ? `<span style="color:${col}">${sign}${parseFloat(t.pts).toFixed(2)}</span>` : '—';
    return `<tr>
      <td class="col-date" style="font-family:'IBM Plex Mono',monospace;font-size:11px">${fmtDate(t.date)}</td>
      <td class="col-pl">${pillPL}</td>
      <td class="col-amt">${amtDisp}</td>
      <td class="col-time" style="font-family:'IBM Plex Mono',monospace;font-size:11px">${t.entry||'—'}</td>
      <td class="col-time" style="font-family:'IBM Plex Mono',monospace;font-size:11px">${t.exit||'—'}</td>
      <td class="col-pts">${ptsDisp}</td>
      <td class="col-stip">${pillStip}</td>
      <td class="col-rem" style="font-size:11px;color:var(--text2)">${escHtml(t.remarks||'')}</td>
      <td class="col-rup" style="font-size:11px;color:var(--text2)">${escHtml(t.rulesUpd||'')}</td>
      <td class="col-act">
        <div style="display:flex;gap:3px;justify-content:center">
          <button class="icon-btn" style="width:26px;height:26px;font-size:12px" onclick="openTradeModal('${key}')">✏️</button>
          <button class="icon-btn" style="width:26px;height:26px;font-size:12px" onclick="deleteTrade('${key}')">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = cards + `
    <div class="trade-table-wrap">
      <table>
        <thead><tr>
          <th class="col-date">Date</th><th class="col-pl">P/L</th>
          <th class="col-amt">Amt ₹</th><th class="col-time">Entry</th>
          <th class="col-time">Exit</th><th class="col-pts">Pts</th>
          <th class="col-stip">Stip</th><th class="col-rem">Remarks</th>
          <th class="col-rup">Rule Upd</th><th class="col-act">Act</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  // ── TOTALS FOOTER ──
  const tc = totalAmt>=0 ? 'var(--green)' : 'var(--red)';
  const pc = totalPts>=0 ? 'var(--green)' : 'var(--red)';
  footer.innerHTML = `
    <span class="tf-label">TOTAL (${entries.length})</span>
    <span style="color:${tc};font-size:13px">${totalAmt>=0?'▲':'▼'} ₹${Math.abs(totalAmt).toLocaleString('en-IN',{maximumFractionDigits:2})}</span>
    <span style="margin-left:8px;color:${pc}">Pts: ${totalPts>=0?'+':''}${totalPts.toFixed(1)}</span>`;

  summary.innerHTML = `Trades: <span>${entries.length}</span> &nbsp; Net: <span style="color:${tc}">${totalAmt>=0?'▲':'▼'} ₹${Math.abs(totalAmt).toLocaleString('en-IN',{maximumFractionDigits:2})}</span>`;
};

window.openTradeModal = function(key = null) {
  editTradeKey = key;
  document.getElementById('tradeModalTitle').textContent = key ? 'Edit Trade' : 'Add Trade';
  const t = key ? (tradesData[key] || {}) : {};
  document.getElementById('tradeDate').value     = t.date     || today();
  document.getElementById('tradePL').value       = t.pl       || '';
  document.getElementById('tradeAmt').value      = t.amt      || '';
  document.getElementById('tradeEntry').value    = t.entry    || '';
  document.getElementById('tradeExit').value     = t.exit     || '';
  document.getElementById('tradePts').value      = t.pts      || '';
  document.getElementById('tradeStip').value     = t.stip     || '';
  document.getElementById('tradeRemarks').value  = t.remarks  || '';
  document.getElementById('tradeRulesUpd').value = t.rulesUpd || '';
  document.getElementById('tradeModal').classList.add('open');
};

window.saveTrade = async function() {
  const trade = {
    date:     document.getElementById('tradeDate').value,
    pl:       document.getElementById('tradePL').value,
    amt:      document.getElementById('tradeAmt').value,
    entry:    document.getElementById('tradeEntry').value,
    exit:     document.getElementById('tradeExit').value,
    pts:      document.getElementById('tradePts').value,
    stip:     document.getElementById('tradeStip').value,
    remarks:  document.getElementById('tradeRemarks').value.trim(),
    rulesUpd: document.getElementById('tradeRulesUpd').value.trim(),
    ts:       Date.now()
  };
  if (!trade.date) { showToast('⚠️ Please select a date'); return; }
  setSyncState('syncing');
  try {
    if (editTradeKey) {
      await fbPut('trades/' + editTradeKey, trade);
      tradesData[editTradeKey] = trade;
    } else {
      const res = await fbPost('trades', trade);
      tradesData[res.name] = trade;
    }
    setSyncState('online');
    closeModal('tradeModal');
    renderTrades();
    showToast('✅ Trade saved');
  } catch(e) { setSyncState('error'); showToast('❌ Save failed: ' + e.message); }
};

window.deleteTrade = function(key) {
  showConfirm('Delete this trade entry?', async () => {
    setSyncState('syncing');
    try {
      await fbDelete('trades/' + key);
      delete tradesData[key];
      setSyncState('online');
      renderTrades();
      showToast('🗑️ Trade deleted');
    } catch(e) { setSyncState('error'); showToast('❌ Delete failed'); }
  });
};

// ════════════════════════════
//  TRADE DETAIL POPUP
// ════════════════════════════
let detailKey = null;

window.openTradeDetail = function(key) {
  detailKey = key;
  const t = tradesData[key];
  if (!t) return;
  const isP  = t.pl === 'Profit';
  const col  = isP ? 'var(--green)' : 'var(--red)';
  const sign = isP ? '+' : '-';

  document.getElementById('dd-date').textContent  = fmtDate(t.date);
  document.getElementById('dd-pill').innerHTML    = t.pl ? `<span class="pill ${isP?'pill-p':'pill-l'}">${t.pl}</span>` : '';
  document.getElementById('dd-amt').textContent   = t.amt ? `${sign}₹${parseFloat(t.amt).toLocaleString('en-IN',{maximumFractionDigits:2})}` : '—';
  document.getElementById('dd-amt').style.color   = t.amt ? col : 'var(--text)';
  document.getElementById('dd-entry').textContent = t.entry || '—';
  document.getElementById('dd-exit').textContent  = t.exit  || '—';
  const ptsTxt = t.pts ? `${sign}${parseFloat(t.pts).toFixed(2)}` : '—';
  document.getElementById('dd-pts').innerHTML  = `<span style="color:${t.pts?col:'var(--text)'}">${ptsTxt}</span>`;
  document.getElementById('dd-stip').innerHTML = t.stip ? `<span class="pill ${t.stip==='Yes'?'pill-y':'pill-n'}">${t.stip}</span>` : '—';

  const notesEl = document.getElementById('dd-notes');
  if (t.remarks || t.rulesUpd) {
    notesEl.style.display = 'block';
    notesEl.innerHTML =
      (t.remarks  ? `<b>NOTE</b> &nbsp;${escHtml(t.remarks)}<br>` : '') +
      (t.rulesUpd ? `<b>RULE UPD</b> &nbsp;${escHtml(t.rulesUpd)}` : '');
  } else {
    notesEl.style.display = 'none';
  }
  document.getElementById('tradeDetailOverlay').classList.add('open');
};

window.handleDetailOverlayClick = function(e) {
  if (e.target === document.getElementById('tradeDetailOverlay')) {
    document.getElementById('tradeDetailOverlay').classList.remove('open');
  }
};

window.editFromDetail = function() {
  document.getElementById('tradeDetailOverlay').classList.remove('open');
  openTradeModal(detailKey);
};

window.deleteFromDetail = function() {
  document.getElementById('tradeDetailOverlay').classList.remove('open');
  deleteTrade(detailKey);
};

// ════════════════════════════
//  SWIPE BETWEEN TABS
// ════════════════════════════
(function() {
  const tabOrder = ['rules', 'trades'];
  let currentTab = 'rules';
  let touchStartX = 0, touchStartY = 0;
  const SWIPE_THRESHOLD = 50;
  const ANGLE_LIMIT = 35; // degrees — ignore near-vertical swipes

  function getActiveTab() {
    return currentTab;
  }

  const content = document.querySelector('.content');

  content.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  content.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    // Ignore if mostly vertical
    if (Math.abs(dy) > Math.abs(dx) * Math.tan(ANGLE_LIMIT * Math.PI / 180)) return;
    if (Math.abs(dx) < SWIPE_THRESHOLD) return;
    const idx = tabOrder.indexOf(currentTab);
    if (dx < 0 && idx < tabOrder.length - 1) {
      doSwitchTab(tabOrder[idx + 1]);
    } else if (dx > 0 && idx > 0) {
      doSwitchTab(tabOrder[idx - 1]);
    }
  }, { passive: true });

  function doSwitchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab-btn').forEach((b, i) =>
      b.classList.toggle('active', tabOrder[i] === name));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }

  // Patch switchTab to also update currentTab
  window.switchTab = function(name) {
    currentTab = name;
    doSwitchTab(name);
  };
})();

window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

let confirmCb = null;
window.showConfirm = function(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  confirmCb = cb;
  document.getElementById('confirmModal').classList.add('open');
};
document.getElementById('confirmOk').onclick = () => {
  closeModal('confirmModal');
  if (confirmCb) confirmCb();
  confirmCb = null;
};

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); });
});

let toastTimer;
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

window.today   = () => new Date().toISOString().split('T')[0];
window.fmtDate = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y.slice(2)}`; };
window.escHtml = s => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ── Start ──
loadAll();
</script>
